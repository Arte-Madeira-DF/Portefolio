<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pirografia do Diogo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- CAPA INICIAL -->
  <section id="capa">
    <div class="capa-conteudo">
      <h1 class="titulo-capa">Pirografia do Diogo</h1>
      <div class="capa-botoes">
        <button id="btnTrabalhos">Trabalhos</button>
      </div>
      <div id="subBotoes" class="hidden">
        <button class="btn-sub" data-target="quadros">Quadros</button>
        <button class="btn-sub" data-target="imans">Ímanes</button>
        <button class="btn-sub" data-target="colecoes">Coleções</button>
      </div>
    </div>
  </section>

  <!-- SITE PRINCIPAL -->
  <section id="site" class="hidden">
    <header class="tabs">
      <ul>
        <li><button class="tab" data-tab="quadros">Quadros</button></li>
        <li><button class="tab" data-tab="imans">Ímanes</button></li>
        <li><button class="tab" data-tab="colecoes">Coleções</button></li>
      </ul>
      <button id="voltarCapa" class="voltar-menu">⬅ Voltar ao Menu</button>
    </header>

    <main>
      <!-- ABA QUADROS -->
      <div id="quadros" class="tab-content">
        <h2>Galeria de Quadros</h2>
        <div id="listaQuadros" class="galeria"></div>
      </div>

      <!-- ABA ÍMANES -->
      <div id="imans" class="tab-content">
        <h2>Galeria de Ímanes</h2>
        <div id="listaImans" class="galeria"></div>
      </div>

      <!-- ABA COLEÇÕES -->
      <div id="colecoes" class="tab-content">
        <h2>Galeria de Coleções</h2>
        <div id="listaColecoes" class="galeria"></div>
      </div>
    </main>

    <footer class="rodape">
      <p>&copy; Pirografia do Diogo - Todos os direitos reservados</p>
    </footer>
  </section>

  <!-- MODAL DE DETALHES -->
  <div id="modal" class="modal hidden">
    <div class="modal-box">
      <span class="close">&times;</span>
      <div class="modal-flex">
        <div class="modal-col-img">
          <img id="modalImg" src="" alt="Imagem da peça">
        </div>
        <div class="modal-col-info">
          <h2 id="modalTitulo"></h2>
          <p><strong>Ano:</strong> <span id="modalAno"></span></p>
          <p><strong>Autor:</strong> <span id="modalAutor"></span></p>
          <p><strong>Nº Peça:</strong> <span id="modalNumero"></span></p>
          <p><strong>Comprimento:</strong> <span id="modalComp"></span></p>
          <p><strong>Largura:</strong> <span id="modalLarg"></span></p>
          <p><strong>Espessura:</strong> <span id="modalEsp"></span></p>
          <br>
          <p><strong>Descrição:</strong></p>
          <p id="modalDesc" class="texto"></p>
        </div>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
